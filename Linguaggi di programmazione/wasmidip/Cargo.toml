[package]
name = "wasmidip"
version = "0.1.0"
edition = "2021"

[dependencies]
rustysynth = "1.3.6"                #Sintetizzatore
wasm-bindgen = "0.2"                #(Funzioni) Rust -> JS
console_error_panic_hook = "0.1"    #Panic visibili in console JS 

[lib]
crate-type = ["cdylib"]             #Indica compatibilità libreria con WASM