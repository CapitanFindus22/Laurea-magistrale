<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Wasm MIDI Player</title>
</head>

<body>
    <!----<button id="file">Select file</button>-->
    <button id="play">Play</button>
    <button id="pause">Pause</button>
    <button id="stop">Stop</button>

    <br>

    <input type="range" name="volume" id="volume" min="0" max="1" value="0.5" step="0.01">

    <script type="module">
        import init, { render_midi } from "./pkg/wasmidip.js";

        await init();

        class MidiPlayer {
            constructor(audioBuffer) {
                this.audioBuffer = audioBuffer;

                this.audioCtx = new AudioContext();
                this.gainNode = this.audioCtx.createGain();
                this.gainNode.connect(this.audioCtx.destination);
                this.gainNode.gain.value = document.getElementById("volume").value;

                this.src = null;
                this.isPlaying = false;
                this.isPaused = false;
            }

            _createSource() {
                this.src = this.audioCtx.createBufferSource();
                this.src.buffer = this.audioBuffer;

                this.src.connect(this.gainNode);

                this.src.onended = () => {
                    this.isPaused = false;
                    this.isPlaying = false;
                    this.src.stop();
                    this.src = null;
                };
            }

            play() {

                if (this.isPaused) {
                    this.audioCtx.resume();
                    this.isPlaying = true;
                    this.isPaused = false;
                    return;
                }

                if (!this.src) {
                    this._createSource();
                    this.src.start(0, 0);
                    this.isPlaying = true;
                }
            }

            pause() {
                if (this.isPlaying) {
                    this.audioCtx.suspend();
                    this.isPaused = true;
                    this.isPlaying = false;
                }
            }

            stop() {
                if (this.isPlaying || this.isPaused) {

                    if (this.isPaused) this.audioCtx.resume();

                    this.src.stop();
                    this.src = null;

                    this.isPlaying = false;
                    this.isPaused = false;
                }
            }

            set volume(value) {
                this.gainNode.gain.value = value;
            }

        }

        async function loadSampleBuffer() {
            const sf2Data = await fetch("GeneralUser-GS.sf2").then(r => r.arrayBuffer());
            const midiData = await fetch("a.mid").then(r => r.arrayBuffer());

            console.log("Rendering...");
            const samples = render_midi(
                new Uint8Array(sf2Data),
                new Uint8Array(midiData)
            );

            const buffer = new AudioBuffer({
                length: samples.length / 2,
                sampleRate: 44100,
                numberOfChannels: 2
            });

            const L = buffer.getChannelData(0);
            const R = buffer.getChannelData(1);

            for (let i = 0, j = 0; i < samples.length; i += 2, j++) {
                L[j] = samples[i];
                R[j] = samples[i + 1];
            }

            return buffer;
        }

        let audioBuffer = await loadSampleBuffer();

        const player = new MidiPlayer(audioBuffer);

        document.getElementById("play").onclick = () => player.play();
        document.getElementById("pause").onclick = () => player.pause();
        document.getElementById("stop").onclick = () => player.stop();

        document.getElementById("volume").oninput = (ev) =>
            player.volume = ev.target.value;

    </script>
</body>

</html>
