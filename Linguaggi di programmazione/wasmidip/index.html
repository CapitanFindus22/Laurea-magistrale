<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Wasm MIDI Player</title>
</head>

<body>
    <!----<button id="file">Select file</button>-->
    <button id="play">Play</button>
    <button id="pause">Pause</button>
    <button id="stop">Stop</button>

    <br>

    <input type="range" name="volume" id="volume" min="0" max="1" value="0.5" step="0.01">

    <script type="module">
        import init, { render_midi } from "./pkg/wasmidip.js";

        await init();

        let audioCtx = null;
        let src = null;
        let gainNode = null;

        let isPlaying = false;
        let isPaused = false;

        async function loadSampleBuffer() {
            const sf2Data = await fetch("GeneralUser-GS.sf2").then(r => r.arrayBuffer());
            const midiData = await fetch("a.mid").then(r => r.arrayBuffer());

            console.log("Rendering...");
            const samples = render_midi(
                new Uint8Array(sf2Data),
                new Uint8Array(midiData)
            );

            const buffer = new AudioBuffer({
                length: samples.length / 2,
                sampleRate: 44100,
                numberOfChannels: 2
            });

            const L = buffer.getChannelData(0);
            const R = buffer.getChannelData(1);

            for (let i = 0, j = 0; i < samples.length; i += 2, j++) {
                L[j] = samples[i];
                R[j] = samples[i + 1];
            }

            return buffer;
        }

        let audioBuffer = await loadSampleBuffer();

        document.getElementById("play").onclick = async () => {

            if (isPaused) {
                audioCtx.resume();
                isPlaying = true;
                isPaused = false;
                return;
            }

            if (!isPlaying) {

                audioCtx = new AudioContext();
                src = audioCtx.createBufferSource();
                src.buffer = audioBuffer;

                gainNode = audioCtx.createGain();
                gainNode.gain.value = document.getElementById("volume").value;

                src.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                src.start(0, 0);
                isPlaying = true;

            }

        };
    
        document.getElementById("pause").onclick = () => {
            if (isPlaying) {
                audioCtx.suspend();
                isPaused = true;
                isPlaying = false;
            }
        };
    
        document.getElementById("stop").onclick = () => {
            if (isPlaying || isPaused) {
                audioCtx.close();

                src = null;
                gainNode = null;
                audioCtx = null;
                isPaused = false;
                isPlaying = false;
            }
        };

            document.getElementById("volume").oninput = (ev) => {
            if (gainNode) {
                gainNode.gain.value = ev.target.value;
            }
        };

    </script>
</body>

</html>
